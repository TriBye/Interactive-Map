<!-- index.html -->

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interactive Worldmap</title>

  <!-- LINKS -->
    <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  >
    <!-- Cesium -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css"
  >
    <!-- Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">

    <h1>Worldmap</h1>

    <!-- Länderinfos -->
    <div id="info">
      <h2>Select Country</h2>
      <p>Click a Country to display</p>
    </div>

    <!-- Favoriten -->
    <div id="favorites">

      <h2>⭐ Favorites</h2>

      <ul id="favorites-list"></ul>

    </div>

  </div>

  <div id="mapcontainer">
    <!-- Karte 2d -->
    <div id="map"></div>
    <!-- Karte 3d -->
    <div id="cesiumContainer"></div>
  </div>


  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script src="cesium-token.js"></script>
  <script src="script.js"></script>

</body>
</html>
